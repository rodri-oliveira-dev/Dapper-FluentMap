coverage:
  precision: 2
  round: down
  range: "80..100"

  status:
    project:
      default:
        target: auto
        threshold: 1%

    patch:
      default:
        target: 80%
        threshold: 1%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

ignore:
  - "test/**"
  - "benchmarks/**"
  - "eng/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/*.g.cs"
  - "**/*.generated.cs"
