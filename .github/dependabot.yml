# Consolidate routine version updates per repository, instead of per ecosystem.
# Multi-ecosystem groups apply to version updates; security updates remain
# independently grouped. Major changes still require human review.
#
# Root .NET SDK patch synchronization is owned by the central workflow in
# rodri-oliveira-dev/.github (.github/workflows/dotnet-sdk-sync.yml).
# .NET major migrations remain an explicit, manually reviewed decision.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dotnet-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/website"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Await Astro checker support before adopting TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
