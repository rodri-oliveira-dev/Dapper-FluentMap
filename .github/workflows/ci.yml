name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_COVERAGE_NOLOGO: "true"
  DOTNET_COVERAGE_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-configuration:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install configuration validator
        run: python3 -m pip install --disable-pip-version-check check-jsonschema==0.38.0

      - name: Validate GitHub workflows
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml

      - name: Validate Dependabot configuration
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  compatibility:
    name: Compatibility (${{ matrix.dapper-lane }}, Dapper ${{ matrix.dapper-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dapper-lane: minimum-and-latest-stable
            dapper-version: 2.1.79

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.slnx -p:DapperPackageVersion=${{ matrix.dapper-version }}

      - name: Audit NuGet dependencies
        run: dotnet list ./Dapper.FluentMap.slnx package --vulnerable --include-transitive

      - name: Build Release
        run: dotnet build ./Dapper.FluentMap.slnx --configuration Release --no-restore -p:DapperPackageVersion=${{ matrix.dapper-version }}

      - name: Test core compatibility
        run: dotnet test ./test/Dapper.FluentMap.Tests/Dapper.FluentMap.Tests.csproj --configuration Release --no-build

      - name: Test generated registration compatibility
        run: dotnet test ./test/Dapper.FluentMap.GeneratedRegistration.Tests/Dapper.FluentMap.GeneratedRegistration.Tests.csproj --configuration Release --no-build

      - name: Test dependency injection compatibility
        run: dotnet test ./test/Dapper.FluentMap.DependencyInjection.Tests/Dapper.FluentMap.DependencyInjection.Tests.csproj --configuration Release --no-build

      - name: Test Dommel compatibility
        run: dotnet test ./test/Dapper.FluentMap.Dommel.Tests/Dapper.FluentMap.Dommel.Tests.csproj --configuration Release --no-build

      - name: Test provider compatibility
        run: dotnet test ./test/Dapper.FluentMap.ProviderCompatibility.Tests/Dapper.FluentMap.ProviderCompatibility.Tests.csproj --configuration Release --no-build

  roslyn-components:
    name: Analyzer and generator compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.slnx

      - name: Audit NuGet dependencies
        run: dotnet list ./Dapper.FluentMap.slnx package --vulnerable --include-transitive

      - name: Build analyzers
        run: dotnet build ./src/Dapper.FluentMap.Analyzers/Dapper.FluentMap.Analyzers.csproj --configuration Release --no-restore

      - name: Build generators
        run: dotnet build ./src/Dapper.FluentMap.Generators/Dapper.FluentMap.Generators.csproj --configuration Release --no-restore

      - name: Test analyzers
        run: dotnet test ./test/Dapper.FluentMap.Analyzers.Tests/Dapper.FluentMap.Analyzers.Tests.csproj --configuration Release

      - name: Test generators
        run: dotnet test ./test/Dapper.FluentMap.Generators.Tests/Dapper.FluentMap.Generators.Tests.csproj --configuration Release

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - compatibility
      - roslyn-components

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate SLNX equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-slnx-equivalence.ps1

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.slnx

      - name: Build Release
        run: dotnet build ./Dapper.FluentMap.slnx --configuration Release --no-restore

      - name: Pack Release
        run: dotnet pack ./Dapper.FluentMap.slnx --configuration Release --no-build --output ./artifacts/packages

      - name: Validate NuGet presentation metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-package-metadata.ps1 -PackageDirectory './artifacts/packages'

      - name: Validate package artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = './artifacts/packages'
          $nupkgs = @(Get-ChildItem -Path $packageDir -Filter '*.nupkg' -File)
          $snupkgs = @(Get-ChildItem -Path $packageDir -Filter '*.snupkg' -File)
          $unexpected = @($nupkgs + $snupkgs | Where-Object { $_.Name -match '(Tests|Benchmarks|AotSmoke)' })

          if ($nupkgs.Count -ne 5) {
            throw "Expected 5 .nupkg files, found $($nupkgs.Count)."
          }

          if ($snupkgs.Count -ne 3) {
            throw "Expected 3 .snupkg files, found $($snupkgs.Count)."
          }

          if ($unexpected.Count -gt 0) {
            throw "Unexpected test/benchmark artifacts: $($unexpected.Name -join ', ')"
          }

          $unsafe = @($nupkgs + $snupkgs | Where-Object { $_.Name -match '\.(2\.0\.0|3\.0\.0)\.(nupkg|snupkg)$' })
          if ($unsafe.Count -gt 0) {
            throw "Unsafe package versions produced by default CI pack: $($unsafe.Name -join ', ')"
          }

      - name: Write release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path './artifacts/release-metadata' | Out-Null
          dotnet list ./Dapper.FluentMap.slnx package --include-transitive --format json |
            Set-Content -Encoding utf8NoBOM -Path './artifacts/release-metadata/dependencies.json'

          $packageFiles = @(
            Get-ChildItem -Path './artifacts/packages' -Filter '*.nupkg' -File
            Get-ChildItem -Path './artifacts/packages' -Filter '*.snupkg' -File
          ) |
            Sort-Object Name |
            ForEach-Object {
              [ordered]@{
                name = $_.Name
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                size = $_.Length
              }
            }

          [ordered]@{
            schemaVersion = '1.0'
            repository = '${{ github.repository }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            dotnetSdk = (dotnet --version)
            packageFiles = @($packageFiles)
          } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8NoBOM -Path './artifacts/release-metadata/release-metadata.json'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
            ./artifacts/release-metadata/*.json
          if-no-files-found: error
          retention-days: 14

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - repository-configuration
      - compatibility
      - roslyn-components
    if: ${{ vars.SONAR_CI_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify SONAR_TOKEN
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN repository secret is required."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.slnx

      - name: Begin Sonar analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_QUALITY_GATE_WAIT: ${{ github.event_name == 'pull_request' }}
        run: >
          dotnet sonarscanner begin
          /k:"rodri-oliveira-dev_Dapper-FluentMap"
          /o:"rodri-oliveira-dev"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}"
          /d:sonar.cs.vscoveragexml.reportsPaths="artifacts/coverage/sonar/coverage.xml"
          /d:sonar.exclusions="test/**,benchmarks/**,eng/consumer-smoke/**,**/bin/**,**/obj/**,**/*.g.cs,**/*.generated.cs"
          /d:sonar.coverage.exclusions="test/**,benchmarks/**,eng/consumer-smoke/**,**/*.g.cs,**/*.generated.cs"
          /d:sonar.qualitygate.wait="${SONAR_QUALITY_GATE_WAIT}"
          /d:sonar.qualitygate.timeout=300

      - name: Build Release
        run: >
          dotnet build ./Dapper.FluentMap.slnx
          --configuration Release
          --no-restore
          --no-incremental
          --disable-build-servers

      - name: Test with coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path './artifacts/coverage/sonar' | Out-Null
          dotnet tool run dotnet-coverage -- collect `
            --settings './eng/sonar-coverage.settings.xml' `
            --output './artifacts/coverage/sonar/coverage.xml' `
            --output-format xml `
            pwsh -NoLogo -NoProfile -File './eng/run-sonar-tests.ps1'

      - name: Verify coverage report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $coveragePath = './artifacts/coverage/sonar/coverage.xml'
          if (-not (Test-Path -LiteralPath $coveragePath)) {
            throw "Coverage report was not created: $coveragePath"
          }

          [xml] $coverage = Get-Content -Raw -LiteralPath $coveragePath
          $moduleNames = if ($coverage.results.modules.module) {
            @($coverage.results.modules.module | ForEach-Object { $_.name })
          } else {
            @($coverage.CoverageSession.Modules.Module | ForEach-Object { $_.ModuleName })
          }

          if ($moduleNames -notcontains 'Dapper.FluentMap.dll') {
            throw 'Coverage report does not contain production assembly Dapper.FluentMap.'
          }

          $unexpectedModules = @($moduleNames | Where-Object { $_ -match '(Tests|Benchmarks|AotSmoke)(\.dll)?$' })
          if ($unexpectedModules.Count -gt 0) {
            throw "Coverage report contains non-production modules: $($unexpectedModules -join ', ')"
          }

      - name: End Sonar analysis
        id: sonar_end
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Report Sonar quality gate conditions
        id: sonar_quality_gate
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: rodri-oliveira-dev_Dapper-FluentMap
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_END_OUTCOME: ${{ steps.sonar_end.outcome }}
        run: |
          set -uo pipefail
          marker="<!-- Dapper-FluentMap:sonar-quality-gate -->"
          dashboard_url="https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}&pullRequest=${SONAR_PULL_REQUEST}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_file="sonar-quality-gate-comment.md"

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "status=UNKNOWN" >> "${GITHUB_OUTPUT}"
            echo "lookup_failed=true" >> "${GITHUB_OUTPUT}"
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud job failed before Quality Gate conditions could be fetched."
              echo
              echo "Cause: \`SONAR_TOKEN\` was not available to the workflow."
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
            exit 0
          fi

          if ! response=$(curl --fail-with-body --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/qualitygates/project_status" \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}"); then
            echo "status=UNKNOWN" >> "${GITHUB_OUTPUT}"
            echo "lookup_failed=true" >> "${GITHUB_OUTPUT}"
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud job failed, and the workflow could not fetch Quality Gate conditions from SonarCloud."
              echo
              echo "Cause: SonarCloud Quality Gate API lookup failed."
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
            exit 0
          fi

          status=$(echo "${response}" | jq -r '.projectStatus.status // "UNKNOWN"')
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "lookup_failed=false" >> "${GITHUB_OUTPUT}"
          echo "SonarQube Cloud quality gate conditions:"
          echo "${response}" | jq '{
            status: .projectStatus.status,
            conditions: [.projectStatus.conditions[]? | {
              metricKey,
              status,
              errorThreshold,
              actualValue
            }]
          }'

          failed_conditions=$(echo "${response}" | jq -r '
            [.projectStatus.conditions[]? | select(.status != "OK") |
              "- `" + .metricKey + "`: status `" + .status + "`, actual `" + (.actualValue // "n/a") + "`, threshold `" + (.errorThreshold // "n/a") + "`"
            ] | join("\n")
          ')
          condition_rows=$(echo "${response}" | jq -r '
            [.projectStatus.conditions[]? |
              "| `" + (.metricKey // "unknown") + "` | **" + (.status // "UNKNOWN") + "** | `" + (.actualValue // "n/a") + "` | `" + (.errorThreshold // "n/a") + "` |"
            ] | join("\n")
          ')

          if [ "${status}" = "OK" ]; then
            {
              echo "${marker}"
              echo "### SonarQube Cloud success"
              echo
              echo "The SonarQube Cloud Quality Gate passed for this PR."
              echo
              echo "Quality Gate status: **${status}**"
              echo
              if [ -n "${condition_rows}" ]; then
                echo "| Metric | Status | Actual | Threshold |"
                echo "| --- | --- | --- | --- |"
                echo "${condition_rows}"
                echo
              fi
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
          elif [ "${status}" = "ERROR" ]; then
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud Quality Gate failed for this PR."
              echo
              echo "Quality Gate status: **${status}**"
              echo
              if [ -n "${failed_conditions}" ]; then
                echo "Failed conditions:"
                echo "${failed_conditions}"
              else
                echo "No failing Quality Gate condition was returned by SonarCloud."
              fi
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
          else
            {
              echo "${marker}"
              echo "### SonarQube Cloud not computed"
              echo
              echo "The SonarQube Cloud job did not produce computed Quality Gate conditions for this PR."
              echo
              echo "Quality Gate status: **${status}**"
              echo "Scanner end outcome: **${SONAR_END_OUTCOME:-unknown}**"
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
          fi

      - name: Comment Sonar quality gate on PR
        if: ${{ always() && github.event_name == 'pull_request' && (steps.sonar_quality_gate.outcome == 'success' || failure()) }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- Dapper-FluentMap:sonar-quality-gate -->";
            const fallbackBody = [
              marker,
              "### SonarQube Cloud failure",
              "",
              "The SonarQube Cloud job failed before the workflow could prepare Quality Gate details.",
              "",
              `- [Open workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
            ].join("\n");
            const body = fs.existsSync("sonar-quality-gate-comment.md")
              ? fs.readFileSync("sonar-quality-gate-comment.md", "utf8")
              : fallbackBody;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - repository-configuration
      - compatibility
      - roslyn-components
      - pack
      - sonar

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          echo "repository-configuration=${{ needs.repository-configuration.result }}"
          echo "compatibility=${{ needs.compatibility.result }}"
          echo "roslyn-components=${{ needs.roslyn-components.result }}"
          echo "pack=${{ needs.pack.result }}"
          echo "sonar=${{ needs.sonar.result }}"

          if [[ "${{ needs.repository-configuration.result }}" != "success" || \
                "${{ needs.compatibility.result }}" != "success" || \
                "${{ needs.roslyn-components.result }}" != "success" || \
                "${{ needs.pack.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not complete successfully."
            exit 1
          fi

          if [[ "${{ needs.sonar.result }}" != "success" && \
                "${{ needs.sonar.result }}" != "skipped" ]]; then
            echo "SonarQube Cloud did not complete successfully."
            exit 1
          fi
