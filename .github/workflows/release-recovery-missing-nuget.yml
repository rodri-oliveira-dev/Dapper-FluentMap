name: Recovery - Publish missing NuGet packages

run-name: "Recover missing NuGet packages for ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix, for example 3.0.1."
        required: true
        type: string
      validated_commit:
        description: "Commit SHA that produced the validated release artifacts."
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH-MISSING-NUGET to run the recovery."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-recovery-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  CI: "true"

jobs:
  recover-missing-nuget-packages:
    name: Publish only missing NuGet.org packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      release-tag-exists: ${{ steps.release-tag.outputs.release_tag_exists }}

    steps:
      - name: Validate recovery request
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::The recovery workflow must be started from master. Current ref: $GITHUB_REF"
            exit 1
          fi

          if [[ "$CONFIRMATION" != "PUBLISH-MISSING-NUGET" ]]; then
            echo "::error::Recovery confirmation did not match PUBLISH-MISSING-NUGET."
            exit 1
          fi

          if [[ "$VERSION" == v* ]]; then
            echo "::error::Enter the semantic version without the 'v' prefix."
            exit 1
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::Invalid semantic version '$VERSION'."
            exit 1
          fi

          major="${VERSION%%.*}"
          if (( major < 3 )); then
            echo "::error::FluentMap recovery requires major version 3 or later."
            exit 1
          fi

          if [[ "$VERSION" == "3.0.0" ]]; then
            echo "::error::Version 3.0.0 is immutable and must not be recovered from a newer workflow."
            exit 1
          fi

          if [[ ! "$VALIDATED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::validated_commit must be a full 40-character commit SHA."
            exit 1
          fi

      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify release tag state
        id: release-tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          set -euo pipefail

          release_tag="v$VERSION"
          git fetch origin master:refs/remotes/origin/master
          git fetch --tags

          if ! git merge-base --is-ancestor "$VALIDATED_COMMIT" origin/master; then
            echo "::error::validated_commit $VALIDATED_COMMIT is not reachable from origin/master."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_sha" != "$VALIDATED_COMMIT" ]]; then
              echo "::error::Tag '$release_tag' points to $tag_sha instead of validated commit $VALIDATED_COMMIT. Refusing to move the tag."
              exit 1
            fi

            echo "Tag '$release_tag' already points to the validated commit."
            echo "release_tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$release_tag' is absent; recovery may continue and will restore it after successful publication."
            echo "release_tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.validated_commit }}
          path: validated-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: validated-source/global.json

      - name: Validate SLNX equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-slnx-equivalence.ps1 `
            -SlnPath './validated-source/Dapper.FluentMap.sln' `
            -SlnxPath './validated-source/Dapper.FluentMap.slnx'

      - name: Restore
        run: dotnet restore ./validated-source/Dapper.FluentMap.slnx

      - name: Build validated release source
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: >-
          dotnet build ./validated-source/Dapper.FluentMap.slnx
          --configuration Release
          --no-restore
          -p:Version="$PACKAGE_VERSION"
          -p:RepositoryCommit="$VALIDATED_COMMIT"
          -p:RepositoryBranch=refs/heads/master
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test ./validated-source/Dapper.FluentMap.slnx --configuration Release --no-build --no-restore

      - name: Pack release packages
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: >-
          dotnet pack ./validated-source/Dapper.FluentMap.slnx
          --configuration Release
          --no-build
          --no-restore
          --output ./artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:RepositoryCommit="$VALIDATED_COMMIT"
          -p:RepositoryBranch=refs/heads/master
          -p:ContinuousIntegrationBuild=true

      - name: Validate release artifacts and write manifest
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          COMMIT: ${{ inputs.validated_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-release-artifacts.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -ManifestPath './artifacts/release-metadata/artifact-manifest.json' `
            -Repository $env:REPOSITORY `
            -RepositoryUrl $env:REPOSITORY_URL `
            -Commit $env:COMMIT `
            -Branch 'refs/heads/master' `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Consumer smoke test release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/consumer-smoke/run-consumer-smoke.ps1 `
            -PackageDirectory './artifacts/packages' `
            -PackageVersion $env:PACKAGE_VERSION `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Generate and verify checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module './eng/PackageCatalog.psm1' -Force
          $catalogPath = './validated-source/eng/package-catalog.json'
          $artifactRoot = (Resolve-Path './artifacts').Path
          $packageFiles = @(
            Get-ChildItem './artifacts/packages' -File |
              Where-Object { $_.Extension -in @('.nupkg', '.snupkg') }
          )
          $expectedPackageFileCount = @(Get-FluentMapPackages -CatalogPath $catalogPath).Count + @(Get-FluentMapPackages -CatalogPath $catalogPath -WithSymbols).Count

          if ($packageFiles.Count -ne $expectedPackageFileCount) {
            throw "Expected $expectedPackageFileCount package artifacts for checksums, found $($packageFiles.Count)."
          }

          $files = @(
            $packageFiles
            Get-Item './artifacts/release-metadata/artifact-manifest.json'
          ) | Sort-Object FullName

          $lines = foreach ($file in $files) {
            $relative = [System.IO.Path]::GetRelativePath($artifactRoot, $file.FullName).Replace('\\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }

          $checksumPath = Join-Path $artifactRoot 'release-metadata/SHA256SUMS'
          [System.IO.File]::WriteAllLines($checksumPath, $lines, [System.Text.UTF8Encoding]::new($false))

          Push-Location $artifactRoot
          try {
            sha256sum --check ./release-metadata/SHA256SUMS
          }
          finally {
            Pop-Location
          }

      - name: Exchange GitHub OIDC token for temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: "${{ vars.NUGET_USER }}"

      - name: Publish missing NuGet.org packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/publish-package-set.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -Source 'https://api.nuget.org/v3/index.json' `
            -ApiKey $env:NUGET_API_KEY `
            -Registry NuGetOrg `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Report recovery completion
        run: echo "NuGet recovery completed for all package identities."

  restore-release-tag:
    name: Restore missing release tag
    needs: recover-missing-nuget-packages
    if: ${{ needs.recover-missing-nuget-packages.outputs.release-tag-exists == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Restore tag to validated commit
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          set -euo pipefail

          release_tag="v$VERSION"
          if [[ "$release_tag" == "v3.0.0" ]]; then
            echo "::error::Tag v3.0.0 is immutable and must not be recreated by recovery automation."
            exit 1
          fi

          git fetch origin master:refs/remotes/origin/master
          git fetch --tags

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_sha" != "$VALIDATED_COMMIT" ]]; then
              echo "::error::Tag '$release_tag' points to $tag_sha instead of validated commit $VALIDATED_COMMIT. Refusing to move the tag."
              exit 1
            fi

            echo "Tag '$release_tag' already points to the validated commit."
            exit 0
          fi

          if ! git cat-file -e "$VALIDATED_COMMIT^{commit}" 2>/dev/null; then
            git fetch origin "$VALIDATED_COMMIT"
          fi

          git tag "$release_tag" "$VALIDATED_COMMIT"
          git push origin "refs/tags/$release_tag"
          echo "Restored tag '$release_tag' to validated commit $VALIDATED_COMMIT."
