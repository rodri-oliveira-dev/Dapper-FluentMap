name: Recovery - Reconcile release state

run-name: "Recover governed release state for ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix, for example 3.0.1."
        required: true
        type: string
      validated_commit:
        description: "Commit SHA that produced the validated release artifacts."
        required: true
        type: string
      original_release_run_id:
        description: "Optional release workflow run_id to download the original release-package artifact."
        required: false
        type: string
      confirmation:
        description: "Type PUBLISH-MISSING-NUGET to run the recovery."
        required: true
        type: string

permissions:
  contents: read

# Shared with the normal release workflow so governed release/package state cannot
# be mutated concurrently. Recovery waits; it never cancels an in-flight release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  CI: "true"

jobs:
  reconcile-release-state:
    name: Reconcile governed release state
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Validate recovery request
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
          ORIGINAL_RELEASE_RUN_ID: ${{ inputs.original_release_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::The recovery workflow must be started from master. Current ref: $GITHUB_REF"
            exit 1
          fi

          if [[ "$CONFIRMATION" != "PUBLISH-MISSING-NUGET" ]]; then
            echo "::error::Recovery confirmation did not match PUBLISH-MISSING-NUGET."
            exit 1
          fi

          if [[ "$VERSION" == v* ]]; then
            echo "::error::Enter the semantic version without the 'v' prefix."
            exit 1
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::Invalid semantic version '$VERSION'."
            exit 1
          fi

          major="${VERSION%%.*}"
          if (( major < 3 )); then
            echo "::error::FluentMap recovery requires major version 3 or later."
            exit 1
          fi

          if [[ "$VERSION" == "3.0.0" ]]; then
            echo "::error::Version 3.0.0 is immutable and must not be recovered from a newer workflow."
            exit 1
          fi

          if [[ ! "$VALIDATED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::validated_commit must be a full 40-character commit SHA."
            exit 1
          fi

          if [[ -n "$ORIGINAL_RELEASE_RUN_ID" && ! "$ORIGINAL_RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::original_release_run_id must be a numeric GitHub Actions run id when provided."
            exit 1
          fi

      - name: Checkout recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Verify release tag state
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          set -euo pipefail

          release_tag="v$VERSION"
          git fetch origin master:refs/remotes/origin/master
          git fetch --tags

          if ! git merge-base --is-ancestor "$VALIDATED_COMMIT" origin/master; then
            echo "::error::validated_commit $VALIDATED_COMMIT is not reachable from origin/master."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_sha" != "$VALIDATED_COMMIT" ]]; then
              echo "::error::Tag '$release_tag' points to $tag_sha instead of validated commit $VALIDATED_COMMIT. Refusing to move the tag."
              exit 1
            fi

            echo "Tag '$release_tag' already points to the validated commit."
          else
            echo "Tag '$release_tag' is absent; recovery may continue and will restore it only after package registries are reconciled."
          fi

      - name: Checkout validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.validated_commit }}
          path: validated-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify partial release evidence
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module './eng/PackageCatalog.psm1' -Force

          $releaseTag = "v$env:PACKAGE_VERSION"
          $tagExists = $false
          & git rev-parse -q --verify "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
          }

          $versionLower = $env:PACKAGE_VERSION.ToLowerInvariant()
          $existingPackages = 0
          $missingPackages = 0
          foreach ($package in @(Get-FluentMapPackages -CatalogPath './validated-source/eng/package-catalog.json')) {
            $packageId = [string]$package.packageId
            $packageIdLower = $packageId.ToLowerInvariant()
            $packageUrl = "https://api.nuget.org/v3-flatcontainer/$packageIdLower/$versionLower/$packageIdLower.$versionLower.nupkg"
            $httpStatus = (& curl `
              --silent `
              --show-error `
              --location `
              --proto '=https' `
              --proto-redir '=https' `
              --retry 3 `
              --retry-delay 2 `
              --retry-all-errors `
              --connect-timeout 10 `
              --max-time 30 `
              --output /dev/null `
              --write-out '%{http_code}' `
              $packageUrl).Trim()

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to query NuGet.org for $packageId $env:PACKAGE_VERSION. Failing closed before recovery."
            }

            switch ($httpStatus) {
              '200' {
                $existingPackages++
                Write-Host "NuGet.org already has $packageId $env:PACKAGE_VERSION; recovery will validate artifact content before skipping it."
              }
              '404' {
                $missingPackages++
                Write-Host "NuGet.org does not currently have $packageId $env:PACKAGE_VERSION."
              }
              default {
                throw "Unexpected NuGet.org response HTTP $httpStatus while checking $packageId $env:PACKAGE_VERSION. Failing closed before recovery."
              }
            }
          }

          if (-not $tagExists -and $existingPackages -eq 0) {
            throw "Release tag $releaseTag is absent and NuGet.org has no governed package for this version. Use the normal release workflow for unreleased versions."
          }

          Write-Host "Recovery preflight accepted: NuGet.org has $existingPackages existing primary package identity or identities and $missingPackages missing primary package identity or identities for $env:PACKAGE_VERSION."

      - name: Obtain original release artifacts when requested
        id: artifact-source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
          ORIGINAL_RELEASE_RUN_ID: ${{ inputs.original_release_run_id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path './artifacts' | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:ORIGINAL_RELEASE_RUN_ID)) {
            Write-Host 'No original_release_run_id was provided; recovery will use the deterministic rebuild fallback from validated_commit.'
            "source=rebuild" >> $env:GITHUB_OUTPUT
            return
          }

          Write-Host "Attempting to download release-package artifact from release workflow run $env:ORIGINAL_RELEASE_RUN_ID."
          $runJson = & gh run view $env:ORIGINAL_RELEASE_RUN_ID --repo $env:GH_REPO --json databaseId,headSha,headBranch,event,workflowName,conclusion 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Unable to inspect run $env:ORIGINAL_RELEASE_RUN_ID; artifact may have expired or be unavailable. Falling back to deterministic rebuild. gh output: $runJson"
            "source=rebuild" >> $env:GITHUB_OUTPUT
            return
          }

          $run = $runJson | ConvertFrom-Json
          if ([string]$run.workflowName -ne 'Release') {
            throw "Run $env:ORIGINAL_RELEASE_RUN_ID belongs to workflow '$($run.workflowName)', expected 'Release'."
          }

          if ([string]$run.headSha -ne $env:VALIDATED_COMMIT) {
            throw "Run $env:ORIGINAL_RELEASE_RUN_ID headSha '$($run.headSha)' does not match validated_commit '$env:VALIDATED_COMMIT'."
          }

          & gh run download $env:ORIGINAL_RELEASE_RUN_ID --repo $env:GH_REPO --name release-package --dir './artifacts'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Original release-package artifact could not be downloaded, likely because retention expired. Falling back to deterministic rebuild from validated_commit."
            Remove-Item -LiteralPath './artifacts' -Recurse -Force
            New-Item -ItemType Directory -Force -Path './artifacts' | Out-Null
            "source=rebuild" >> $env:GITHUB_OUTPUT
            return
          }

          ./eng/verify-release-checksums.ps1 -ArtifactRoot './artifacts'
          ./eng/validate-release-artifacts.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -ManifestPath './artifacts/release-metadata/artifact-manifest.json' `
            -Repository $env:REPOSITORY `
            -RepositoryUrl $env:REPOSITORY_URL `
            -Commit $env:VALIDATED_COMMIT `
            -Branch 'refs/heads/master' `
            -CatalogPath './validated-source/eng/package-catalog.json' `
            -SourceRoot './validated-source' `
            -VerifyExistingManifest

          Write-Host "Recovery will reuse the exact original release-package artifact bytes from run $env:ORIGINAL_RELEASE_RUN_ID."
          "source=original" >> $env:GITHUB_OUTPUT

      - name: Setup .NET for rebuild fallback
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: validated-source/global.json

      - name: Validate SLNX equivalence for rebuild fallback
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-slnx-equivalence.ps1 `
            -SlnPath './validated-source/Dapper.FluentMap.sln' `
            -SlnxPath './validated-source/Dapper.FluentMap.slnx'

      - name: Restore rebuild fallback source
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        run: dotnet restore ./validated-source/Dapper.FluentMap.slnx

      - name: Build rebuild fallback source
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: >-
          dotnet build ./validated-source/Dapper.FluentMap.slnx
          --configuration Release
          --no-restore
          -p:Version="$PACKAGE_VERSION"
          -p:RepositoryCommit="$VALIDATED_COMMIT"
          -p:RepositoryBranch=refs/heads/master
          -p:ContinuousIntegrationBuild=true

      - name: Test rebuild fallback source
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        run: dotnet test ./validated-source/Dapper.FluentMap.slnx --configuration Release --no-build --no-restore

      - name: Pack rebuild fallback source
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: >-
          dotnet pack ./validated-source/Dapper.FluentMap.slnx
          --configuration Release
          --no-build
          --no-restore
          --output ./artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:RepositoryCommit="$VALIDATED_COMMIT"
          -p:RepositoryBranch=refs/heads/master
          -p:ContinuousIntegrationBuild=true

      - name: Validate rebuild fallback artifacts and write manifest
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          COMMIT: ${{ inputs.validated_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/validate-release-artifacts.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -ManifestPath './artifacts/release-metadata/artifact-manifest.json' `
            -Repository $env:REPOSITORY `
            -RepositoryUrl $env:REPOSITORY_URL `
            -Commit $env:COMMIT `
            -Branch 'refs/heads/master' `
            -CatalogPath './validated-source/eng/package-catalog.json' `
            -SourceRoot './validated-source'

      - name: Consumer smoke test rebuild fallback artifacts
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/consumer-smoke/run-consumer-smoke.ps1 `
            -PackageDirectory './artifacts/packages' `
            -PackageVersion $env:PACKAGE_VERSION `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Write rebuild fallback dependency inventory
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path './artifacts/release-metadata' | Out-Null
          dotnet list ./validated-source/Dapper.FluentMap.slnx package --include-transitive --format json |
            Set-Content -Encoding utf8NoBOM -Path './artifacts/release-metadata/dependencies.json'

      - name: Generate and verify rebuild fallback checksums
        if: ${{ steps.artifact-source.outputs.source == 'rebuild' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module './eng/PackageCatalog.psm1' -Force
          $catalogPath = './validated-source/eng/package-catalog.json'
          $artifactRoot = (Resolve-Path './artifacts').Path
          $packageFiles = @(
            Get-ChildItem './artifacts/packages' -File |
              Where-Object { $_.Extension -in @('.nupkg', '.snupkg') }
          )
          $expectedPackageFileCount = @(Get-FluentMapPackages -CatalogPath $catalogPath).Count + @(Get-FluentMapPackages -CatalogPath $catalogPath -WithSymbols).Count

          if ($packageFiles.Count -ne $expectedPackageFileCount) {
            throw "Expected $expectedPackageFileCount package artifacts for checksums, found $($packageFiles.Count)."
          }

          $files = @(
            $packageFiles
            Get-Item './artifacts/release-metadata/artifact-manifest.json'
            Get-Item './artifacts/release-metadata/dependencies.json'
          ) | Sort-Object FullName

          $lines = foreach ($file in $files) {
            $relative = [System.IO.Path]::GetRelativePath($artifactRoot, $file.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }

          $checksumPath = Join-Path $artifactRoot 'release-metadata/SHA256SUMS'
          [System.IO.File]::WriteAllLines($checksumPath, $lines, [System.Text.UTF8Encoding]::new($false))
          ./eng/verify-release-checksums.ps1 -ArtifactRoot './artifacts'

      - name: Exchange GitHub OIDC token for temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: "${{ vars.NUGET_USER }}"

      - name: Recover and verify NuGet.org packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/publish-package-set.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -Source 'https://api.nuget.org/v3/index.json' `
            -ApiKey $env:NUGET_API_KEY `
            -Registry NuGetOrg `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Recover and verify GitHub Packages
        shell: pwsh
        env:
          GITHUB_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./eng/publish-package-set.ps1 `
            -PackageDirectory './artifacts/packages' `
            -Version $env:PACKAGE_VERSION `
            -Source $env:GITHUB_PACKAGE_SOURCE `
            -ApiKey $env:GITHUB_PACKAGE_TOKEN `
            -Registry GitHubPackages `
            -RepositoryOwner $env:REPOSITORY_OWNER `
            -GitHubToken $env:GITHUB_PACKAGE_TOKEN `
            -CatalogPath './validated-source/eng/package-catalog.json'

      - name: Restore or verify release tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          set -euo pipefail

          release_tag="v$VERSION"
          if [[ "$release_tag" == "v3.0.0" ]]; then
            echo "::error::Tag v3.0.0 is immutable and must not be recreated by recovery automation."
            exit 1
          fi

          git fetch origin master:refs/remotes/origin/master
          git fetch --tags

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_sha" != "$VALIDATED_COMMIT" ]]; then
              echo "::error::Tag '$release_tag' points to $tag_sha instead of validated commit $VALIDATED_COMMIT. Refusing to move the tag."
              exit 1
            fi

            echo "Git tag: correct."
            exit 0
          fi

          git tag "$release_tag" "$VALIDATED_COMMIT"
          git push origin "refs/tags/$release_tag"
          echo "Git tag: restored $release_tag to validated commit $VALIDATED_COMMIT."

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          assets=(
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
            ./artifacts/release-metadata/*
          )

          release_args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists; refreshing governed release artifacts."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GH_REPO" \
            "${release_args[@]}"

      - name: Attest recovered release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
            ./artifacts/release-metadata/artifact-manifest.json
            ./artifacts/release-metadata/dependencies.json
            ./artifacts/release-metadata/SHA256SUMS

      - name: Final release reconciliation summary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ inputs.version }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
          ARTIFACT_SOURCE: ${{ steps.artifact-source.outputs.source }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tagSha = (& git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagSha -ne $env:VALIDATED_COMMIT) {
            throw "Final reconciliation failed: $env:RELEASE_TAG points to $tagSha instead of $env:VALIDATED_COMMIT."
          }

          & gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Final reconciliation failed: GitHub Release $env:RELEASE_TAG is absent."
          }

          $artifactSourceLabel = if ($env:ARTIFACT_SOURCE -eq 'original') { 'original release-package artifact' } else { 'deterministic rebuild fallback' }
          Write-Host 'Release recovery reconciliation summary:'
          Write-Host "validated commit: OK ($env:VALIDATED_COMMIT)"
          Write-Host "release artifacts: $artifactSourceLabel + validated"
          Write-Host 'NuGet.org primary packages: complete and content-validated after asynchronous convergence'
          Write-Host 'NuGet.org symbol packages: submitted via NuGet.org V3 tooling; NuGet.org exposes no public .snupkg content-comparison endpoint'
          Write-Host 'GitHub Packages: complete'
          Write-Host "Git tag: correct ($env:RELEASE_TAG)"
          Write-Host 'GitHub Release: present'
          Write-Host 'attestations: recreated for recovered release artifacts by this workflow'
          Write-Host 'Release recovery completed and governed release state reconciled.'
