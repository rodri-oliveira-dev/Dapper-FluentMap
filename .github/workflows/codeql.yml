name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C# with CodeQL
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify consistent CodeQL action versions
        shell: bash
        run: |
          mapfile -t codeql_refs < <(grep -Eo 'github/codeql-action/[^@ ]+@[0-9a-f]{40}' .github/workflows/codeql.yml)
          if (( ${#codeql_refs[@]} < 2 )); then
            echo "::error::Expected at least two SHA-pinned CodeQL steps."
            exit 1
          fi
          distinct_sha_count=$(printf '%s\n' "${codeql_refs[@]}" | cut -d@ -f2 | sort -u | wc -l)
          if (( distinct_sha_count != 1 )); then
            echo "::error::CodeQL steps must all use the same SHA."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fbfa9f37476c0024508d051f3c34fcca3366b0e2 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.slnx

      - name: Build for analysis
        run: dotnet build ./Dapper.FluentMap.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@fbfa9f37476c0024508d051f3c34fcca3366b0e2 # v4
        with:
          category: '/language:csharp'
