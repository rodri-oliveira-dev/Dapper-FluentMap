name: Performance Regression Report

on:
  schedule:
    - cron: "19 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-report-${{ github.repository }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  materialization:
    name: Materialization hot paths (report only)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore benchmark project
        run: dotnet restore ./benchmarks/Dapper.FluentMap.Benchmarks/Dapper.FluentMap.Benchmarks.csproj

      - name: Build benchmark project
        run: dotnet build ./benchmarks/Dapper.FluentMap.Benchmarks/Dapper.FluentMap.Benchmarks.csproj --configuration Release --no-restore

      - name: Run materialization benchmark report
        run: >-
          dotnet run --project ./benchmarks/Dapper.FluentMap.Benchmarks/Dapper.FluentMap.Benchmarks.csproj
          --configuration Release --no-build --
          --filter "*DapperWithFluentMapRootMapping*" "*QueryMappedSimple" "*RuntimeQueryMappedSimple"
          "*RuntimeQueryGeneratedSimpleExtraColumn*" "*QueryMappedGeneratedPropertyConverter*"
          "*QueryMappedTwoSegments*" "*QueryMappedThreeSegments*"
          --exporters json

      - name: Compare with checked-in baseline
        shell: pwsh
        run: |
          $result = Get-ChildItem './.tmp/benchmarks/BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json' |
            Select-Object -First 1
          if ($null -eq $result) {
            throw 'BenchmarkDotNet JSON output was not produced.'
          }
          ./eng/compare-benchmark-results.ps1 `
            -BaselinePath './benchmarks/baselines/materialization-windows-net10.json' `
            -CurrentPath $result.FullName `
            -OutputDirectory './artifacts/benchmark-report'
          Get-Content './artifacts/benchmark-report/benchmark-comparison.md' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: materialization-benchmark-report
          path: |
            ./.tmp/benchmarks/BenchmarkDotNet.Artifacts/results/*
            ./artifacts/benchmark-report/*
          if-no-files-found: error
          retention-days: 90
