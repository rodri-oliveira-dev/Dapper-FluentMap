name: Documentation Links

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/documentation-links.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/documentation-links.yml'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check documentation links
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude '^https://github\.com/rodri-oliveira-dev/Dapper-FluentMap/stargazers$'
            --exclude '^https://rodri-oliveira-dev\.github\.io/Dapper-FluentMap(?:/pt-br)?/$'
            --exclude-path '(^|/)AnalyzerReleases\.(Shipped|Unshipped)\.md$'
            --exclude-path '^website/src/content/docs/'
            './**/*.md'
          fail: true
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install portal dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Build portal
        working-directory: website
        run: npm run build

      - name: Collect unique portal external links
        working-directory: website
        run: node scripts/collect-external-links.mjs > dist/external-links.txt

      - name: Check portal external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --host-concurrency 2
            --host-request-interval 250ms
            --scheme https
            --exclude '^https://github\.com/rodri-oliveira-dev/Dapper-FluentMap/stargazers$'
            --exclude '^https://rodri-oliveira-dev\.github\.io/Dapper-FluentMap/'
            './website/dist/external-links.txt'
          fail: true
          token: ${{ github.token }}
